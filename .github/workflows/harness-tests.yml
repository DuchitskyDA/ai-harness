name: harness tests

on:
  push:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install pytest
        run: pip install pytest PyYAML

      - name: Ensure jq is available
        run: |
          if command -v jq >/dev/null 2>&1; then
            echo "jq already present: $(command -v jq)"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install jq
          elif [ "$RUNNER_OS" = "Windows" ]; then
            choco install jq -y
          else
            echo "Unhandled RUNNER_OS=$RUNNER_OS for jq install" >&2
            exit 1
          fi

      - name: Install preset dependencies
        run: npm ci --prefix harness/presets/ts

      - name: Run harness test suite
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
          PYTHONWARNINGS: 'error::SyntaxWarning'
        run: python -X utf8 -B -m pytest harness claude .github/workflows/tests -q --ignore=harness/runtime --ignore=harness/staging

      - name: Run preset test suite
        run: node --test "harness/presets/ts/test/*.test.mjs"
